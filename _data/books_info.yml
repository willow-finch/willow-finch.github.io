  book1:
    title: "浮木"
    etitle: "Mayfly and the Withered"
    description: | 
      南忘远给自己取名“忘远”——忘掉过去，不想未来。
      
      他以为自己会一个人静静地烂在时间的角落里。

      直到那个叫梅菲的男孩敲响他的门。

      一者以为自己早已死去，一者即将死去。

  book2:
    title: "两颗蒲公英"
    description: |
      “你有什么打算？”赵芸芸第九十九次问道。

      沈泽英第九十九次回答道：“不知道。”

      赵芸芸拼命忍住不问这个问题第一百次。

